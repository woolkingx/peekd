[database]
enabled = true
retention_days = 30
write_limit_seconds = 5

[monitoring]
every_exe = false

[log]
ignore_ports = [53]
ignore_domains = ["localhost"]
ignore_networks = ["127.0.0.0/8", "::1/128"]

[metrics]
enabled = true
interval_seconds = 60

[web]
enabled = true
port = 5100
bind = "0.0.0.0"         # set to "127.0.0.1" to restrict to localhost
top_limit = 200           # max destinations shown in /api/top
static_dir = ""           # "" = embedded HTML; path = serve from disk
refresh_seconds = 30      # dashboard auto-refresh interval
default_since = "24h"     # default time range on page load
