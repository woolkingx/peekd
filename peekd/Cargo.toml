[package]
name = "peekd"
version = "0.1.2"
edition = "2021"

[dependencies]
peekd-common = { path = "../peekd-common", features = ["user"] }
libbpf-rs = { workspace = true }
tokio = { workspace = true }
async-stream = { workspace = true }
futures = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
lru = { workspace = true }
ipnet = { workspace = true }
tabwriter = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
notify-rust = { version = "4", optional = true }
sha2 = "0.11"
glob = "0.3"
reqwest = { version = "0.11", features = ["json"], optional = true }
serde_json = { workspace = true }
chrono = { workspace = true }
bytemuck = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
axum = { workspace = true }
tower-http = { version = "0.5", features = ["fs"] }

[build-dependencies]
libbpf-cargo = { workspace = true }
vmlinux = { workspace = true }

[features]
default = []
notifications = ["notify-rust"]
alerts-webhook = ["reqwest"]
lua-filters = ["mlua"]
remote-clickhouse = ["reqwest"]

[dependencies.mlua]
version = "0.9"
features = ["lua54", "vendored"]
optional = true

[[bin]]
name = "peekd"
path = "src/main.rs"
